<!DOCTYPE html> 
<html> 
<head> 
    <title>ID Selector</title> 
 
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script> 
 
    <script> 
        $(document).ready(function() { 
            $("#heading").css("color", "red"); 
        }); 
    </script> 
</head> 
 
<body> 
 
    <h2 id="heading">Welcome to jQuery</h2> 
 
</body> 
</html>
