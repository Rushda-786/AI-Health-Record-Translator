<!DOCTYPE html>
<html>
<head>
  <title>jQuery Animation</title> 
 
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script> 
 
    <script> 
        $(document).ready(function() { 
 
            $("#btn").click(function() { 
 
                $("#box").animate({ 
                    width: "300px", 
                    height: "150px", 
                    marginLeft: "100px" 
                }, 1000); 
 
            }); 
 
        }); 
    </script> 
</head> 
 
<body> 
 
    <button id="btn">Animate</button> 
 
    <br><br> 
 
    <div id="box"> 
        Animation 
    </div> 
 
</body> 
</html>
