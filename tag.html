<!DOCTYPE html> 
<html> 
<head> 
    <title>Tag Selector</title> 
 
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script> 
 
    <script> 
        $(document).ready(function() { 
            $("p").css("color", "blue"); 
        }); 
    </script> 
</head> 
 
<body> 
 
    <p>First Paragraph</p> 
    <p>Second Paragraph</p> 
    <p>Third Paragraph</p> 
 
</body> 
</html>
